<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="PartyHub : jeux de soirée multijoueurs sur navigateur" />
    <meta name="theme-color" content="#0d0a1f" />
    <meta name="application-name" content="PartyHub" />
    <meta property="og:site_name" content="PartyHub" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="PartyHub" />
    <meta
      property="og:description"
      content="Jeux de soirée multijoueurs sur navigateur : un écran principal, et les téléphones des joueurs."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="shortcut icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PartyHub</title>
    <style>
      .boot {
        font-family: sans-serif;
        text-align: center;
        padding: 2rem;
        color: #b3acdb;
      }
      /* Si l’application ne démarre pas, le message apparaît après 12 secondes au lieu d’un écran sombre et muet.
         Pur CSS et lien simple : la politique de sécurité interdit les scripts en ligne. Une fois l’application
         montée, elle remplace ce contenu. */
      .boot-late {
        margin-top: 1rem;
        opacity: 0;
        animation: boot-late 0.4s 12s forwards;
      }
      .boot-late a {
        color: #ffd166;
        font-weight: bold;
      }
      @keyframes boot-late {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <p>Chargement de PartyHub…</p>
        <div class="boot-late">
          <p>PartyHub ne s’est pas chargé. Vérifiez la connexion, puis rechargez la page.</p>
          <a href="/">Recharger la page</a>
        </div>
      </div>
      <noscript>Activez JavaScript pour utiliser PartyHub.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
