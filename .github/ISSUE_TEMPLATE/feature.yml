name: Fonctionnalité
description: Proposer une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: besoin
    attributes:
      label: Besoin
      description: Quel problème la fonctionnalité résout-elle, et pour qui ?
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Idée proposée
    validations:
      required: false
  - type: checkbox
    id: donnees
    attributes:
      label: Impact sur les données
      options:
        - label: Cette idée change la base de données ou les paquets existants (à décrire dans la proposition).
          required: false
