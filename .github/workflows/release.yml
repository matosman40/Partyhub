# Publication d'une version : lorsqu'un tag vX.Y.Z est poussé, ou lorsque le workflow
# « Étiqueter une version » l'appelle (un tag créé par GITHUB_TOKEN ne déclenche pas d'autre workflow).
# Vérifie la version, reteste le code, publie l'image sur GHCR (amd64 et arm64),
# vérifie l'image téléchargée sans authentification, puis crée la release GitHub.
name: Publication d'une version

on:
  push:
    tags: ["v*"]
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le tag et la version du paquet
        id: version
        run: |
          # La version vient de package.json : c'est la même chose que le tag, qu'il soit poussé
          # à la main ou créé par le workflow « Étiqueter une version ».
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide dans package.json : $VERSION (attendu X.Y.Z)"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à package.json ($VERSION)"; exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md ne contient pas de section [$VERSION]"; exit 1
          fi
          # Les fichiers d'installation doivent épingler cette version exacte (pas une version antérieure).
          for file in compose.yaml deploy/casaos/compose.https.yaml; do
            pinned="$(grep -o 'ghcr.io/matosman40/partyhub:[0-9.]*' "$file" | head -1 | cut -d: -f2)"
            if [ "$pinned" != "$VERSION" ]; then
              echo "$file épingle $pinned, le tag indique $VERSION"; exit 1
            fi
          done
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MAJOR_MINOR=$MAJOR_MINOR" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/matosman40/partyhub:${{ env.VERSION }}
            ghcr.io/matosman40/partyhub:${{ env.MAJOR_MINOR }}
            ghcr.io/matosman40/partyhub:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}

      - name: Vérifier l'image publiée, téléchargée sans authentification
        run: |
          docker logout ghcr.io
          docker pull ghcr.io/matosman40/partyhub:${VERSION}
          # Volume Docker géré (pas un dossier de l'hôte) : il reçoit les droits de l'utilisateur
          # « node » de l'image, sinon le serveur ne peut pas créer sa base.
          docker run -d --name verif -p 18282:8282 -v verif-data:/data \
            -e ADMIN_PASSWORD=verif-admin-password ghcr.io/matosman40/partyhub:${VERSION}
          for i in $(seq 1 60); do
            s=$(docker inspect --format='{{.State.Health.Status}}' verif 2>/dev/null || echo starting)
            [ "$s" = "healthy" ] && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:18282/api/health || { docker logs verif; exit 1; }
          docker rm -f verif

  # Le fichier d'installation CasaOS est testé avec l'image publiée, avant la release : un échec bloque la publication.
  verify-casaos:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/verify-casaos.yml
    with:
      image: ghcr.io/matosman40/partyhub:${{ needs.publish.outputs.version }}

  release:
    needs: [publish, verify-casaos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Créer la release GitHub avec les notes du CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "PartyHub $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
